services:
  attack-mode:
    build:
      context: .
    image: ${IMAGE:-attack-mode:latest}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${HOST_PORT:-8001}:8080"
    environment:
      APP_ENV: production
      PORT: 8080
      DB_PATH: /data/attack.db
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env (copy .env.example to .env)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - attack-data:/data
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s

volumes:
  attack-data:
    name: attack-mode-data
